import streamlit as st


def login_style():
    """Injects the login page's CSS. Shares design tokens with theme.py."""
    st.markdown(
        """
        <style>
        .stApp { background: var(--bg, #f3f2f1); }
        .block-container { padding-top: 3rem; }

        .login-box {
            background: #ffffff;
            padding: 44px 40px;
            border-radius: 8px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.10);
            border-top: 4px solid #005b96;
            text-align: center;
        }
        .login-title {
            color: #003366;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 6px;
            font-family: 'Segoe UI', -apple-system, sans-serif;
        }
        .login-subtitle { color: #605e5c; font-size: 14px; line-height: 1.6; }
        .online-status { color: #107c10; font-weight: 600; }

        label { color: #201f1e !important; font-weight: 600 !important; font-size: 13px !important; }
        input {
            background: #fff !important;
            color: #201f1e !important;
            border: 1px solid #c8c6c4 !important;
            border-radius: 4px !important;
        }
        input:focus { border: 1.5px solid #005b96 !important; box-shadow: none !important; }

        div.stButton > button {
            width: 100%;
            height: 42px;
            background: #005b96;
            color: white;
            border-radius: 4px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.15s ease;
        }
        div.stButton > button:hover { background: #003366; color: white; }
        .stAlert { border-radius: 6px; }
        </style>
        """,
        unsafe_allow_html=True,
    )


def check_login():
    """Returns True if the current session is authenticated."""
    if "authenticated" not in st.session_state:
        st.session_state.authenticated = False
    return st.session_state.authenticated


def login_page():
    """Renders the centered login card and handles the login button."""
    login_style()

    left, center, right = st.columns([1, 1.3, 1])
    with center:
        st.markdown(
            """
            <div class="login-box">
                <div class="login-title">🏥 BILIK GERAKAN</div>
                <div class="login-subtitle">
                    <b>Epidemiological Surveillance System</b><br>
                    Government Monitoring Portal<br><br>
                    <span class="online-status">🟢 System Online</span>
                </div>
            </div>
            """,
            unsafe_allow_html=True,
        )
        st.write("")
        username = st.text_input("Username", placeholder="Masukkan username")
        password = st.text_input("Password", type="password", placeholder="Masukkan password")
        st.write("")

        if st.button("LOGIN", use_container_width=True):
            authenticate_user(username, password)


def authenticate_user(username, password):
    """Validates credentials against st.secrets and starts the session."""
    if not username or not password:
        st.error("❌ Sila masukkan username dan password.")
        return

    try:
        users = st.secrets["users"]
    except Exception:
        st.error("⚠️ User database tidak dijumpai. Sila semak fail secrets.toml.")
        return

    if username not in users:
        st.error("❌ Username tidak wujud.")
        return

    if password != users[username]:
        st.error("❌ Password salah.")
        return

    st.session_state.authenticated = True
    st.session_state.username = username
    st.session_state.role = st.secrets.get("roles", {}).get(username, "Viewer")
    st.success("Login berjaya")
    st.rerun()


def logout():
    """Renders the account panel + logout control in the sidebar."""
    st.sidebar.markdown("---")
    st.sidebar.markdown(
        f"""
        <div style="font-size:13px; line-height:1.6;">
            👤 <b>{st.session_state.get('username', '-')}</b><br>
            <span style="color:#605e5c;">Role: {st.session_state.get('role', '-')}</span>
        </div>
        """,
        unsafe_allow_html=True,
    )
    st.sidebar.write("")
    if st.sidebar.button("🚪 Logout", use_container_width=True):
        st.session_state.authenticated = False
        st.session_state.username = None
        st.session_state.role = None
        st.rerun()
